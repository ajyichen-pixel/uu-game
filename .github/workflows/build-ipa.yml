name: Build UU遊戲 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    # Xcode 26.3 has a reproducible SwiftPM model-graph crash for this
    # dependency set.  Use the same stable macOS/Xcode pair used by the
    # upstream project before its Xcode 26 migration.
    runs-on: macos-15

    steps:
      - name: Check out source and signing engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select upstream-compatible Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build and package without a distribution certificate
        run: |
          make iphoneos
          mkdir -p dist
          cp packages/Feather.ipa dist/UU-Game-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UU-Game-unsigned-IPA
          path: dist/UU-Game-unsigned.ipa
          if-no-files-found: error
