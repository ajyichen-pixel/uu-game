name: Build UU遊戲 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Check out source and signing engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select upstream-compatible Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Archive without a distribution certificate
        run: |
          xcodebuild archive \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UUGame.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/UUGameDerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: bash ./scripts/package-ipa.sh "$RUNNER_TEMP/UUGame.xcarchive" dist/UU-Game-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UU-Game-unsigned-IPA
          path: dist/UU-Game-unsigned.ipa
          if-no-files-found: error
