name: Build UU遊戲 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    # The UI uses Apple Liquid Glass APIs introduced with the iOS 26 SDK.
    # The heavyweight Vapor graph that made Xcode 26.3 crash was removed.
    runs-on: macos-15

    steps:
      - name: Check out source and signing engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode with the iOS 26 SDK
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build and package without a distribution certificate
        run: |
          make iphoneos
          mkdir -p dist
          cp packages/Feather.ipa dist/UU-Game-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UU-Game-unsigned-IPA
          path: dist/UU-Game-unsigned.ipa
          if-no-files-found: error
